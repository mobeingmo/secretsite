<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecretMessage</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to top right, #ffe6f0, #fff1f7);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }

    .message {
      margin-top: 20px;
      font-size: 24px;
      color: #d6336c;
      animation: fadeIn 2s ease 2s forwards;
      opacity: 0;
      z-index: 2;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    /* Glowing hearts */
    .heart {
      position: absolute;
      color: #ff4d88;
      font-size: 20px;
      animation: floatHeart 6s linear infinite;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      50% {
        transform: translateY(-100px) scale(1.2);
        opacity: 0.6;
      }
      100% {
        transform: translateY(-200px) scale(0.8);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- SVG Flower -->
  <svg width="150" height="250" viewBox="0 0 150 250" xmlns="http://www.w3.org/2000/svg" style="z-index:2">
    <!-- Stem -->
    <rect x="72" y="80" width="6" height="120" fill="green" />

    <!-- Leaves -->
    <ellipse cx="50" cy="160" rx="20" ry="10" fill="green" transform="rotate(-30 50 160)" />
    <ellipse cx="100" cy="160" rx="20" ry="10" fill="green" transform="rotate(30 100 160)" />

    <!-- Petals -->
    <path d="M75 40 C60 30, 45 50, 60 80 C65 90, 85 90, 90 80 C105 50, 90 30, 75 40 Z" fill="#ff5c8a" />
    <path d="M75 40 C65 35, 55 50, 65 75 C70 80, 80 80, 85 75 C95 50, 85 35, 75 40 Z" fill="#ff79a8" />
  </svg>

  <!-- Message -->
  <div class="message">I love you Hala :3 🌷</div>

  <!-- Floating hearts -->
  <script>
    const createHeart = () => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '💖';
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.fontSize = `${Math.random() * 12 + 18}px`;
      heart.style.animationDuration = `${Math.random() * 2 + 4}s`;
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    };

    setInterval(createHeart, 400);
  </script>
</body>
</html>
